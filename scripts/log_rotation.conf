# SDS Nexus Platform - Log Rotation Configuration
# Install: sudo cp scripts/log_rotation.conf /etc/logrotate.d/sds-nexus

/var/log/sds-nexus/*.log {
    # Rotate daily
    daily
    
    # Keep 30 days of logs
    rotate 30
    
    # Compress old logs
    compress
    delaycompress
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if log is empty
    notifempty
    
    # Create new log with these permissions
    create 0644 sds-nexus sds-nexus
    
    # Use date as suffix
    dateext
    dateformat -%Y%m%d
    
    # Rotate even if file is not modified
    ifempty
    
    # Post-rotation script
    postrotate
        # Signal application to reopen log files (if needed)
        docker-compose exec -T api pkill -USR1 python || true
    endscript
}

# Backup logs
/var/log/sds-nexus/backup.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}

# Health check logs
/var/log/sds-nexus/health-check.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    create 0644 root root
}

# Prometheus logs (if using systemd service)
/var/log/prometheus/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 prometheus prometheus
    postrotate
        systemctl reload prometheus || true
    endscript
}

# Grafana logs (if using systemd service)
/var/log/grafana/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 grafana grafana
    postrotate
        systemctl reload grafana-server || true
    endscript
}
