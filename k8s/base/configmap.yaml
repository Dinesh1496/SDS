apiVersion: v1
kind: ConfigMap
metadata:
  name: sds-nexus-config
  namespace: sds-nexus
data:
  APP_ENV: "development"
  APP_NAME: "SDS Nexus Platform (K8s)"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  APP_DEBUG: "false"
  
  # Database
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "sds_nexus"
  DB_USER: "sds_nexus_user"
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  
  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Monitoring
  MONITOR_CLUSTER_HEALTH_INTERVAL: "300"
  MONITOR_NODE_INTERVAL: "300"
  MONITOR_OBJECT_STORAGE_INTERVAL: "3600"
  
  # Chargeback
  CHARGEBACK_CURRENCY_PRIMARY: "GBP"
  CHARGEBACK_CURRENCY_SECONDARY: "USD"
  CHARGEBACK_GBP_PER_GB_MONTH: "0.05"
  CHARGEBACK_USD_PER_GB_MONTH: "0.06"
