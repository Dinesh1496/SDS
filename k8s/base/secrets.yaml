# NOTE: This is a template. Create actual secrets with:
# kubectl create secret generic sds-nexus-secrets \
#   --from-literal=app-secret-key=YOUR_SECRET \
#   --from-literal=jwt-secret-key=YOUR_JWT_SECRET \
#   --from-literal=db-password=YOUR_DB_PASSWORD \
#   -n sds-nexus

apiVersion: v1
kind: Secret
metadata:
  name: sds-nexus-secrets
  namespace: sds-nexus
type: Opaque
stringData:
  # CHANGE THESE VALUES!
  app-secret-key: "changeme-generate-32-char-secret-key"
  jwt-secret-key: "changeme-generate-32-char-jwt-secret"
  db-password: "changeme-secure-database-password"
  
  # Ceph/RGW credentials (update with your values)
  ceph-ssh-key: ""
  rgw-access-key: ""
  rgw-secret-key: ""
  
  # SMTP credentials (update with your values)
  smtp-password: ""
