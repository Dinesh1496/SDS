apiVersion: v1
kind: Service
metadata:
  name: sds-nexus-api
  namespace: sds-nexus
  labels:
    app: sds-nexus-api
spec:
  type: LoadBalancer  # Exposes on localhost for Docker Desktop
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: sds-nexus-api
