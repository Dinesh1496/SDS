# Prometheus configuration for SDS Nexus Platform

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'sds-nexus'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # SDS Nexus Platform API
  - job_name: 'sds-nexus-api'
    static_configs:
      - targets:
          - 'api:8000'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # PostgreSQL Exporter (if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    # Remove this scrape config if postgres-exporter is not deployed

  # Node Exporter for system metrics (if deployed on platform server)
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    # Remove this scrape config if node-exporter is not deployed
